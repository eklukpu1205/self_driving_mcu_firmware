; Separate config: the existing platformio.ini and main.c are unchanged.
[platformio]
default_envs = servo_low_speed_test

[env:servo_low_speed_test]
platform = https://github.com/norandomtechie/platform-raspberrypi.git#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
build_flags =
    -DSERVO_LOW_SPEED_TEST=1
build_src_filter =
    +<actuator_hal.c>
    +<servo_low_speed_test.c>
monitor_speed = 115200
